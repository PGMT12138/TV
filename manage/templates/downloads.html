<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>下载与缓存管理 · CINE</title>
<style>
:root{color-scheme:dark;font-family:system-ui,sans-serif;color:#e4e4e7;background:#09090b}*{box-sizing:border-box}body{margin:0}main{max-width:1200px;margin:auto;padding:28px 20px}h1{font-size:24px;margin:12px 0}h2{font-size:17px}a{color:#6ee7b7;text-decoration:none}button,input,select{font:inherit;border:1px solid #3f3f46;border-radius:8px;background:#18181b;color:inherit;padding:9px 13px}button{cursor:pointer}button:disabled{opacity:.4;cursor:default}button.primary{background:#047857;border-color:#059669}button.danger{color:#fca5a5}small,.muted{color:#a1a1aa;font-size:13px}header,.bar,.actions{display:flex;align-items:center;gap:12px;flex-wrap:wrap}header{justify-content:space-between}section,.card{border:1px solid #27272a;background:#111114;border-radius:14px;padding:18px;margin-top:18px}.bar{justify-content:space-between}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.card{margin:0;min-width:0}.card h2{overflow-wrap:anywhere;margin:0 0 7px}.card p{overflow-wrap:anywhere}.state{font-size:12px;border-radius:12px;padding:4px 9px;background:#27272a}.state.completed{color:#6ee7b7}.state.failed{color:#fca5a5}.actions{margin-top:14px;font-size:13px}progress{width:100%;height:8px;accent-color:#34d399}#error{color:#fca5a5;min-height:22px}#preview{border:1px solid #3f3f46;border-radius:14px;background:#111114;color:#e4e4e7;width:min(900px,94vw)}#preview::backdrop{background:#000b}video{width:100%;max-height:65vh;background:#000;margin-top:14px}[hidden]{display:none!important}.empty{padding:40px;text-align:center;color:#a1a1aa}@media(max-width:650px){.cards{grid-template-columns:1fr}main{padding:18px 12px}.bar{align-items:flex-start}h1{font-size:21px}}
</style></head><body><main>
<header><div><a href="./">← 返回管理端</a><h1>下载与缓存管理</h1><small>查看所有用户的下载任务与服务端文件</small></div></header>
<p id="error" role="alert"></p>
<div id="panel">
<section><div class="bar"><div><h2>影片缓存总开关</h2><p class="muted">关闭会停止排队和正在执行的缓存任务，禁止网站新建和重试。已有文件仍可查看、下载和删除。</p></div><button id="toggle" role="switch" aria-checked="false"></button></div><p class="muted" id="storage"></p><p id="availability" class="muted"></p></section>
<section><div class="bar"><div class="actions" style="margin:0"><label for="filter">记录筛选</label><select id="filter"><option value="">全部下载记录</option><option value="completed">服务端已保存文件</option><option value="downloading">正在下载</option><option value="queued">排队中</option><option value="resolving">解析来源</option><option value="muxing">封装视频</option><option value="verifying">校验文件</option><option value="failed">失败</option><option value="cancelled">取消</option><option value="interrupted">中断</option><option value="expired">到期</option><option value="deleted">已删除</option><option value="missing">文件不存在</option></select></div><button id="refresh">刷新</button></div><p id="count" class="muted"></p><div id="records" class="cards"></div><div class="bar" style="margin-top:18px"><button id="prev">上一页</button><small id="page"></small><button id="next">下一页</button></div></section>
</div>
<dialog id="preview"><div class="bar"><h2 id="previewTitle">视频预览</h2><button id="closePreview">关闭预览</button></div><video id="video" controls preload="metadata"></video><p class="muted" id="previewHint">能否在浏览器预览取决于视频编码；不支持时可下载后用本地播放器查看。</p></dialog>
</main><script>
const $=id=>document.getElementById(id), base='api/admin/downloads';
const states={queued:'排队中',resolving:'解析来源',downloading:'下载到服务器',muxing:'封装视频',verifying:'校验文件',completed:'文件已就绪',failed:'下载失败',cancelled:'已取消',interrupted:'已中断',expired:'已到期',deleted:'已删除',missing:'文件不存在'};
const active=s=>['queued','resolving','downloading','muxing','verifying'].includes(s),retry=s=>['failed','cancelled','interrupted','expired','missing'].includes(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const bytes=n=>{if(!n)return '0 B';let i=Math.min(3,Math.floor(Math.log(n)/Math.log(1024)));return (n/1024**i).toFixed(i?1:0)+' '+['B','KB','MB','GB'][i]};
const date=n=>n?new Date(n*1000).toLocaleString():'—';
let offset=0,total=0,enabled=false,busy=false,loading=false,items=[],poll;
async function api(url,options={}){const r=await fetch(url,{credentials:'same-origin',...options,headers:{'Content-Type':'application/json',...options.headers}});const d=await r.json();if(!r.ok){throw Error(d.detail||d.error||'请求失败')}return d}
function render(){
 $('toggle').textContent=enabled?'已开启 · 点击关闭':'已关闭 · 点击开启';$('toggle').setAttribute('aria-checked',String(enabled));$('toggle').className=enabled?'primary':'';
 $('records').innerHTML=items.length?items.map(t=>{const p=t.segments_total?t.segments_done/t.segments_total:t.bytes_total?t.bytes_done/t.bytes_total:0;return `<article class="card"><div class="bar"><h2>${esc(t.source.title)} · ${esc(t.source.episodeName)}</h2><span class="state ${esc(t.status)}">${esc(states[t.status]||t.status)}</span></div><p class="muted">用户：${esc(t.username||'已删除用户')} · ${esc(t.source.siteName)} · ${esc(t.source.flag)}</p><p class="muted">创建：${date(t.created_at)}<br>更新：${date(t.updated_at)}</p><p>${bytes(t.size||t.bytes_done)}${t.bytes_total?' / '+bytes(t.bytes_total):''}${t.segments_total?' · 分片 '+t.segments_done+' / '+t.segments_total:''}</p>${t.status==='downloading'?`<progress max="1" ${p?'value="'+Math.min(1,p)+'"':''} aria-label="下载进度"></progress>`:''}${t.error?'<p style="color:#fbbf24">'+esc(t.error)+'</p>':''}${t.filename?'<p class="muted">'+esc(t.filename)+'<br>保留至：'+date(t.expires_at)+'</p>':''}${t.status==='completed'&&!t.file_available?'<p style="color:#fbbf24">文件已不存在</p>':''}<div class="actions">${t.file_available?`<button data-action="preview" data-id="${t.id}">查看视频</button><a href="${base}/${t.id}/file">下载文件</a>`:''}${active(t.status)?`<button data-action="cancel" data-id="${t.id}">取消任务</button>`:''}${retry(t.status)?`<button data-action="retry" data-id="${t.id}" ${!enabled?'disabled':''}>从头重试</button>`:''}${t.status!=='deleted'?`<button class="danger" data-action="delete" data-id="${t.id}">删除服务端文件</button>`:''}</div></article>`}).join(''):'<div class="empty">暂无符合条件的记录</div>';
 $('count').textContent=`共 ${total} 条记录，自动刷新；删除文件后保留历史记录。`;
 $('page').textContent=total?`${offset+1}–${Math.min(offset+100,total)} / ${total}`:'0 / 0';$('prev').disabled=offset===0;$('next').disabled=offset+100>=total;
}
async function refresh(){if(loading||busy)return;loading=true;clearTimeout(poll);try{const d=await api(`${base}?offset=${offset}&status=${encodeURIComponent($('filter').value)}`);items=d.items;total=d.total;enabled=d.enabled;$('storage').textContent=`缓存占用 ${bytes(d.usedBytes)} / ${bytes(d.maxBytes)}；完成文件默认保留 ${d.retentionHours} 小时。`;$('availability').textContent=d.available?'':'服务器未安装 ffmpeg / ffprobe，网站暂不能创建缓存任务。';render()}catch(e){$('error').textContent=e.message}finally{loading=false;if(!$('panel').hidden)poll=setTimeout(refresh,2000)}}
async function action(fn){if(busy)return;busy=true;$('error').textContent='';try{await fn()}catch(e){$('error').textContent=e.message}finally{busy=false;await refresh()}}
$('toggle').onclick=()=>action(()=>api(base+'/settings',{method:'PUT',body:JSON.stringify({enabled:!enabled})}));
$('refresh').onclick=refresh;$('filter').onchange=()=>{offset=0;refresh()};$('prev').onclick=()=>{offset=Math.max(0,offset-100);refresh()};$('next').onclick=()=>{offset+=100;refresh()};
$('records').onclick=e=>{const button=e.target.closest('button[data-action]');if(!button)return;const {id,action:kind}=button.dataset;if(kind==='preview'){const task=items.find(t=>t.id===id);$('previewTitle').textContent=task.filename;$('video').src=`${base}/${id}/file?preview=true`;$('preview').showModal();return}if(kind==='delete'&&!confirm('删除此任务的服务端文件？正在进行的任务将停止，下载记录和本机文件保留。'))return;void action(()=>api(`${base}/${id}${kind==='delete'?'':'/'+kind}`,{method:kind==='delete'?'DELETE':'POST'}))};
function closeVideo(){$('video').pause();$('video').removeAttribute('src');$('video').load()}
$('closePreview').onclick=()=>{$('preview').close()};$('preview').addEventListener('close',closeVideo);
$('video').onerror=()=>{$('previewHint').textContent='此浏览器无法预览该编码或文件读取失败，请下载文件后用本地播放器查看。'};
refresh();
</script></body></html>
