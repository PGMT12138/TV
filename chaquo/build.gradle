plugins {
    id 'com.android.library'
    id 'com.chaquo.python'
}

// buildPython 允许在 local.properties 里用 buildPython=... 覆盖（Windows 构建用），默认为 Linux 路径
def buildPythonCmd = '/usr/bin/python3.10'
try {
    def localProps = new Properties()
    def localPropsFile = rootProject.file('local.properties')
    if (localPropsFile.exists()) localPropsFile.withInputStream { localProps.load(it) }
    if (localProps.getProperty('buildPython')) buildPythonCmd = localProps.getProperty('buildPython')
} catch (ignored) {
}

android {
    namespace = 'com.fongmi.chaquo'

    compileSdk {
        version = release(37)
    }

    defaultConfig {
        minSdk 24
        targetSdk 37
        python {
            version = "3.10"
            buildPython buildPythonCmd
            pip {
                install("-r", "requirements.txt")
            }
        }
    }

    flavorDimensions = ["abi"]

    productFlavors {
        arm64_v8a {
            dimension "abi"
            ndk { abiFilters "arm64-v8a" }
        }
        armeabi_v7a {
            dimension "abi"
            ndk { abiFilters "armeabi-v7a" }
        }
    }

    sourceSets {
        main {
            python.srcDirs = ["src/main/python"]
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation project(':catvod')
}